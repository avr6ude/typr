[package]
name = "typr"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
description = "CLI typing test in Rust, monkeytype-style with code mode and syntax highlighting"
license = "MIT"
repository = "https://github.com/avr6ude/typr"
readme = "README.md"
keywords = ["typing", "tui", "monkeytype", "cli", "test"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
